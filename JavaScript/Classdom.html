<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add & Remove</title>
    <style>
        div {
            height: 100px;
            width: 300px;
            background-color: rgb(173, 230, 181);
            border: 4px solid rgb(25, 113, 113);
        }
    </style>
</head>
<body>
   <h1>DOM Manipulation</h1>
    <button onclick="addBox()">Add Box</button>
    <button onclick="removeBox()">Remove Box</button>

    <script> 
        function addBox() {
              box = document.querySelector('body');
              newBox = document.createElement('div');
              box.appendChild(newBox);
        }

        function removeBox() {
            box = document.querySelector('body');
            newBox = document.querySelector('div');
            box.removeChild(newBox);
        }
    </script>
</body>
</html>
