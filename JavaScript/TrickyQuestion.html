<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Operators Practice</title>
</head>
<body>

    <h2>Open Console to See Output</h2>

    <script>

        console.log(1 + "2" + 3); //123 why? because 1 + "2" is "12", and then "12" + 3 is "123"

        console.log(1 + 2 + "3"); //33 why? because 1 + 2 is 3, and then 3 + "3" is "33"

        console.log("5" - 2); //3 why? because "5" is converted to 5, and then 5 - 2 is 3
        console.log("5" + 2); //52 why? because "5" is converted to 5, and then 5 + 2 is 7, but since one operand is a string, the result is a string "52"

        console.log(0 == false); //true because 0 is falsy and false is also falsy, so they are considered equal in loose equality
        console.log(0 === false); //false because === checks for both value and type, and 0 is a number while false is a boolean

        let a = 5;
        console.log(a++); // 5 because a++ returns the value of a before incrementing it, so it returns 5 and then increments a to 6
        console.log(a); //6 why? because a was incremented to 6 in the previous line

        let b = 5;
        console.log(++b); //6 why? because ++b increments b before returning its value, so it returns 6
        console.log(b); //6 why? because b was incremented to 6 in the previous line

        let x = 5;
        let y = x++ + ++x;
        console.log(y); //12 why? because x++ returns 5 and then increments x to 6, and ++x increments x to 7 and then returns 7, so y is 5 + 7 = 12

        console.log(true + true); //true is 1, false is 0, so 1 + 1 = 2
        console.log(true + false); //1 + 0 = 1 = false
        console.log(false + false); //0 + 0 = 0 = false

        console.log([] == false); //true, because [] is converted to "" which is falsy

        console.log("" == 0); //true, because "" is converted to 0

        console.log(5 && 10); //10, because both are truthy, so it returns the last operand
        console.log(0 || 100); //100, because 0 is falsy, so it returns the last operand

        console.log(!"hello"); //false because "hello" is a non-empty string which is truthy, so !"hello" is false
        console.log(!0); //true because 0 is falsy, so !0 is true

        console.log("10" * "2"); //20 because both "10" and "2" are converted to numbers, and then 10 * 2 is 20

        console.log("10" / 2); //5 because "10" is converted to 10, and then 10 / 2 is 5

        console.log("hello" * 2); //NaN because "hello" cannot be converted to a number, so the result is NaN

        console.log(typeof NaN); //number, because NaN is considered a number in JavaScript

        console.log([] + []); //"" (empty string) because both [] are converted to "" and then "" + "" is ""

        console.log([] + {}); //"[object Object]" because [] is converted to "" and {} is converted to "[object Object]", so "" + "[object Object]" is "[object Object]"

        console.log({} + []); //"[object Object]" because {} is converted to "[object Object]" and [] is converted to "", so "[object Object]" + "" is "[object Object]"
        let c = "5";
        let d = 2;
        console.log(c - d + c); // "3" + "5" = "35", because c - d is 3, and then 3 + "5" is "35"

        console.log([] != ![]); //false, because [] is truthy, so ![] is false, and [] != false is false

        console.log(typeof null); //object (this is a known quirk in JavaScript)

        console.log([] == 0); //true, because [] is converted to "" which is converted to 0

        console.log([1,2] + [3,4]); //"[1,2][3,4]" because [1,2] is converted to "1,2" and [3,4] is converted to "3,4", so "1,2" + "3,4" is "1,2,3,4"

        console.log("2" > "12"); //true, because string comparison is done lexicographically MEANS "2" is greater than "1" in "12"

        console.log(2 > "12"); //false because "12" is converted to 12, and 2 is not greater than 12

        console.log(Boolean("false")); //true, because any non-empty string is truthy

        console.log(Boolean("")); //false, because empty string is falsy

        console.log(100 / "10"); //10, because "10" is converted to 10

        console.log(true == "1"); //true, because true is converted to 1 and "1" is converted to 1

        console.log(false == "0"); //true, because false is converted to 0 and "0" is converted to 0

        console.log(false === "0"); //false, because === checks for both value and type

        console.log(1 < 2 < 3); //true, because 1 < 2 is true (1), and true < 3 is true (1)

        console.log(3 > 2 > 1); //true, because 3 > 2 is true (1), and true > 1 is true (1)

        console.log(+"10"); //10, because + converts the string "10" to a number

        console.log(+"hello"); //NaN, because + cannot convert the string "hello" to a number

        let p = 10;
        console.log(p += 5); //15, because p += 5 is equivalent to p = p + 5

        let q = 10;
        console.log(q *= 2); //20, because q *= 2 is equivalent to q = q * 2

        console.log(2 ** 3); //8, because 2 to the power of 3 is 8

        console.log(typeof typeof 1); //string, because typeof 1 is "number", and typeof "number" is "string"

        console.log([] instanceof Array); //true, because [] is an instance of Array

        console.log({} instanceof Object); //true, because {} is an instance of Object

        console.log([] == ""); //true, because [] is converted to "" which is falsy

        console.log([0] == 0); //true, because [0] is converted to 0 which is falsy

    </script>

</body>
</html>
