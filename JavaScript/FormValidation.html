<!DOCTYPE html>
<html lang="en">
<head>
    <title>Form Validation</title>
</head>
<body>

    <form id="myForm">
        <label>Username:</label>
        <input type="text" id="username" placeholder="Enter Username">
        <button type="submit">Submit</button>
    </form> 
    <br>

    <form id="emailForm">
        <label>Email:</label>
        <input type="email" id="email" placeholder="Enter Email">
        <button type="submit">Submit</button>
    </form>
    <br>
    
    <form id="passwordForm">
        <label>Password:</label>
        <input type="password" id="password" placeholder="Enter Password">
        <button type="submit">Submit</button>
    </form>

    <script>

        let f = document.getElementById("myForm");

        f.addEventListener("submit", (event) => {

            event.preventDefault();

            let username = document
                .getElementById("username")
                .value
                .trim();

            let regex = /^[a-zA-Z0-9_]+$/;

            if (username === "") {
                alert("Username is required!");
            }
            else if (username.length < 3) {
                alert("Username must be at least 3 characters!");
            }
            else if (username.length > 15) {
                alert("Username must not exceed 15 characters!");
            }
            else if (!regex.test(username)) {
                alert("Only letters, numbers, and underscores allowed!");
            }
            else {
                alert("Valid Name");
            }

            
        });

        let f1 = document.getElementById("emailForm");

        f1.addEventListener("submit", (event) => {

            event.preventDefault();

            let email = document
                .getElementById("email")
                .value
                .trim();

            let regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email === "") {
                alert("Email is required!");
            }
            else if (!regex.test(email)) {
                alert("Invalid Email!");
            }
            else {
                alert("Valid Email");
            }

            
        });

        let f2 = document.getElementById("passwordForm");

        f2.addEventListener("submit", (event) => {

            event.preventDefault();

            let password = document
                .getElementById("password")
                .value
                .trim();

            let regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

            if (password === "") {
                alert("Password is required!");
            }
            else if (!regex.test(password)) {
                alert("Invalid Password!");
            }
            else {
                alert("Valid Password");
            }

            
        });

    </script>

</body>
</html>
