<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Variables in JS</title>
</head>

<body>

<script>

    const a = 10;

    // a = 20; // re - initialize

    // const a = 30; // re - declare

    console.log(a); //10


    //scope - function var

    function varvari() {

        var name = "Gamana";

        console.log(name);

    }

    varvari()

    // console.log(name); error


    //scope - let & const (block)

    if(true) {

        let z = 100;

        const pi = 3.14;

        console.log(z)

        console.log(pi)

    }

    // console.log(z) error

    // console.log(pi) error

</script>

</body>
</html>
