<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ice Cream Heaven</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Poppins', sans-serif; background: #fff; }

  header {
    background: linear-gradient(135deg, #f9a8c9 0%, #f472b6 50%, #f9a8c9 100%);
    padding: 28px 20px 20px;
    text-align: center;
  }
  header h1 {
    font-family: 'Pacifico', cursive;
    font-size: 2.4rem;
    color: white;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.15);
    margin-bottom: 18px;
  }
  nav { display: flex; justify-content: center; gap: 50px; }
  nav a {
    font-family: 'Pacifico', cursive;
    color: white;
    text-decoration: none;
    font-size: 0.95rem;
  }
  nav a:hover { text-decoration: underline; }

  .cards-section {
    background: #fce4ec;
    padding: 40px 30px 60px;
  }
  .cards-row {
    display: flex;
    gap: 18px;
    justify-content: center;
    align-items: flex-end;
  }

  .card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    text-align: center;
    padding-bottom: 18px;
    width: 195px;
    overflow: hidden;
    transition: transform 0.2s;
  }
  .card:hover { transform: translateY(-5px); }

  .card:nth-child(1) { margin-bottom: 50px; }
  .card:nth-child(2) { margin-bottom: 80px; }
  .card:nth-child(3) { margin-bottom: 20px; }
  .card:nth-child(4) { margin-bottom: 70px; }
  .card:nth-child(5) { margin-bottom: 40px; }

  /* Replace the emoji div below with <img> tag for real photos */
  .card-img {
    width: 100%;
    height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 5rem;
    background: #fef9f9;
  }
  .card:nth-child(2) .card-img { background: #e0f7f7; }

  /* Uncomment and use this if you add <img> tags:
  .card img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    display: block;
  }
  */

  .card h3 {
    font-family: 'Pacifico', cursive;
    color: #f43f8e;
    font-size: 1rem;
    margin: 12px 10px 4px;
  }
  .card p {
    color: #555;
    font-size: 0.88rem;
    font-weight: 500;
  }

  footer {
    background: linear-gradient(135deg, #f9a8c9 0%, #f472b6 50%, #f9a8c9 100%);
    text-align: center;
    padding: 18px;
    color: white;
    font-size: 0.85rem;
  }
  footer .heart { color: #ff2266; }
</style>
</head>
<body>

<header>
  <h1>🍦 Ice Cream Heaven 🍨</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#">Flavors</a>
    <a href="#">Offers</a>
    <a href="#">Contact</a>
  </nav>
</header>

<div class="cards-section">
  <div class="cards-row">

    <!-- Card 1: Vanilla Dream -->
    <!-- To use your own image, replace the div below with:
         <img src="your-vanilla-image.jpg"> -->
    <div class="card">
      <div class="card-img">🍨</div>
      <h3>Vanilla Dream</h3>
      <p>Price:120</p>
    </div>

    <!-- Card 2: Choco Blast -->
    <div class="card">
      <div class="card-img">🍫</div>
      <h3>Choco Blast</h3>
      <p>Price:150</p>
    </div>

    <!-- Card 3: Strawberry Swirl -->
    <div class="card">
      <div class="card-img">🍓</div>
      <h3>Strawberry Swirl</h3>
      <p>Price:180</p>
    </div>

    <!-- Card 4: Mango Tango -->
    <div class="card">
      <div class="card-img">🥭</div>
      <h3>Mango Tango</h3>
      <p>Price:200</p>
    </div>

    <!-- Card 5: Minty Fresh -->
    <div class="card">
      <div class="card-img">🍃</div>
      <h3>Minty Fresh</h3>
      <p>Price:250</p>
    </div>

  </div>
</div>

<footer>
  © 2025 Ice Cream Heaven. Made with <span class="heart">❤</span> and sprinkles.
</footer>

</body>
</html>
